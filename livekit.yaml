# LiveKit media server config. The API key pair is generated by War Room and shared through the
# livekit-keys volume (see docker-compose.yml), so there is nothing to copy by hand.
port: 7880
key_file: /keys/livekit-keys.yaml
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Discover the public IP via STUN so remote clients can reach the media ports.
  use_external_ip: true
room:
  empty_timeout: 300
logging:
  level: info
